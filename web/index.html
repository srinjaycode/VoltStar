<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoltStar Neural AI - Telemetry Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-gauges@2.1.7/gauge.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>⚡ VOLTSTAR NEURAL AI ⚡</h1>
    <div class="subtitle">REAL-TIME TELEMETRY DASHBOARD</div>
  </div>

  <div class="dashboard">
    <div class="main-chart">
      <div class="chart-header">
        <div class="chart-title">📊 TELEMETRY ANALYSIS</div>
        <div class="chart-controls">
          <div class="control-group">
            <label>View:</label>
            <select id="chartType">
              <option value="telemetry">Telemetry</option>
              <option value="power-rpm">Power vs RPM</option>
              <option value="torque-rpm">Torque vs RPM</option>
              <option value="acceleration">Acceleration & Jerk</option>
              <option value="energy-distance">Energy vs Distance</option>
              <option value="soc-distance">SOC vs Distance</option>
              <option value="voltage-current">V-I Curve</option>
              <option value="speed-distance">Speed vs Distance</option>
            </select>
          </div>
        </div>
      </div>
      <div class="chart-wrapper">
        <canvas id="telemetryChart"></canvas>
      </div>
    </div>

    <div class="gauges">
        <div class="gauge-container">
            <canvas data-type="radial-gauge" id="speed-gauge"></canvas>
        </div>
        <div class="gauge-container">
            <canvas data-type="radial-gauge" id="voltage-gauge"></canvas>
        </div>
        <div class="gauge-container">
            <canvas data-type="radial-gauge" id="current-gauge"></canvas>
        </div>
        <div class="gauge-container">
            <canvas data-type="radial-gauge" id="power-gauge"></canvas>
        </div>
        <div class="gauge-container">
            <canvas data-type="radial-gauge" id="rpm-gauge"></canvas>
        </div>
    </div>

    <div class="secondary-charts">
      <div class="chart-wrapper">
        <canvas id="powerSpeedChart"></canvas>
      </div>
      <div class="chart-wrapper">
        <canvas id="efficiencyChart"></canvas>
      </div>
    </div>

  </div>
</div>

<!-- ai sidebar -->
<div class="ai-sidebar" id="aiSidebar">
  <div class="ai-sidebar-header">
    <button class="ai-close-mobile" id="closeSidebarBtn">✕</button>
    <div class="ai-sidebar-title">
      <div class="ai-status-dot"></div>
      <span>NEURAL AI ASSISTANT</span>
    </div>
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="chat">Chat</button>
      <button class="tab-btn" data-tab="diagnostics">Diagnostics</button>
      <button class="tab-btn" data-tab="training">Training</button>
    </div>
  </div>

  <!-- chat tab -->
  <div id="chatTab" class="tab-content active">
    <div class="ai-chat-container">
      <div id="aiMessages" class="ai-messages"></div>
      <div class="ai-chat-input">
        <div class="ai-input-group">
          <input type="text" id="aiInput" class="ai-input" placeholder="Ask me anything about your ride...">
          <button id="sendMessageBtn" class="ai-send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <button class="clear-memory-btn" id="clearChatBtn">Clear Chat History</button>
      </div>
    </div>
  </div>

  <!-- diagnostics tab -->
  <div id="diagnosticsTab" class="tab-content">
    <div id="aiDiagnostics" class="ai-diagnostics"></div>
  </div>

  <!-- training tab -->
  <div id="trainingTab" class="tab-content">
    <div class="ai-training">
      <div class="training-controls">
        <button id="trainModelBtn" class="train-btn">🧠 Train Model</button>
      </div>
      <div id="trainingLog" class="training-log"></div>
    </div>
  </div>
</div>

<!-- mobile toggle -->
<button class="ai-toggle" id="aiToggleBtn">
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<script src="app.js"></script>
</body>
</html>
